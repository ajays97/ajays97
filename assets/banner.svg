<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="AJ Srinivas — Building the capability and economic layer for the agent economy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a">
        <animate attributeName="stop-color" values="#0a0a0a;#0f1020;#0a0a0a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1a1a2e">
        <animate attributeName="stop-color" values="#1a1a2e;#1f2347;#1a1a2e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f3460">
        <animate attributeName="stop-color" values="#0f3460;#0a2240;#0f3460" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9f"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff9f" stroke-width="0.4" opacity="0.18"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>

  <g opacity="0.7">
    <circle cx="120" cy="80" r="3" fill="#00ff9f">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="180" r="3" fill="#00d4ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="60" r="2" fill="#00ff9f">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="190" r="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(80, 100)" opacity="0.8">
    <circle r="6" fill="#00ff9f" filter="url(#glow)"/>
    <circle cx="60" r="6" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="120" r="6" fill="#00ff9f" filter="url(#glow)"/>
    <line x1="6" y1="0" x2="54" y2="0" stroke="#00ff9f" stroke-width="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="66" y1="0" x2="114" y2="0" stroke="#00d4ff" stroke-width="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="translate(1000, 140)" opacity="0.8">
    <circle r="6" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="60" r="6" fill="#00ff9f" filter="url(#glow)"/>
    <circle cx="120" r="6" fill="#00d4ff" filter="url(#glow)"/>
    <line x1="6" y1="0" x2="54" y2="0" stroke="#00d4ff" stroke-width="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="66" y1="0" x2="114" y2="0" stroke="#00ff9f" stroke-width="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="600" y="115" text-anchor="middle"
        font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
        font-size="64" font-weight="700" fill="url(#accent)" filter="url(#glow)">
    Ajay Srinivas
  </text>

  <text x="600" y="155" text-anchor="middle"
        font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
        font-size="16" font-weight="400" fill="#e4e4e7" letter-spacing="2">
    BUILDING THE CAPABILITY &amp; ECONOMIC LAYER FOR THE AGENT ECONOMY
  </text>

  <line x1="500" y1="175" x2="700" y2="175" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>

  <text x="600" y="200" text-anchor="middle"
        font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
        font-size="13" font-weight="400" fill="#00ff9f" opacity="0.85">
    crypto rails · onchain identity · machine-to-machine commerce
  </text>
</svg>
